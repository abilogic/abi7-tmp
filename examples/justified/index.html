<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ABI7 Grid — Justified</title>
  <link rel="stylesheet" href="../../dist/abi7-grid.css">
  <link rel="stylesheet" href="../shared/page.css">
</head>
<body>
  <div class="toolbar">
    <label>targetRowHeight <input id="targetRowHeight" type="range" min="100" max="360" step="10" value="200"><output id="targetRowHeightOut">200</output></label>
    <label>minRowHeight <input id="minRowHeight" type="range" min="60" max="300" step="10" value="120"><output id="minRowHeightOut">120</output></label>
    <label>maxRowHeight <input id="maxRowHeight" type="range" min="200" max="500" step="10" value="300"><output id="maxRowHeightOut">300</output></label>
    <label>gap <input id="gap" type="range" min="0" max="30" value="8"><output id="gapOut">8</output></label>
    <label>lastRow
      <select id="lastRow">
        <option value="left" selected>left</option>
        <option value="center">center</option>
        <option value="right">right</option>
        <option value="justify">justify</option>
      </select>
    </label>
  </div>

  <div id="gallery" class="demo-grid tall"></div>
  <div class="stats" id="stats">…</div>

  <script type="module" src="../shared/theme.js"></script>
  <script type="module" src="./demo.js"></script>
</body>
</html>
