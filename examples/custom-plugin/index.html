<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ABI7 Grid — Custom plugin (CounterPlugin)</title>
  <link rel="stylesheet" href="../../dist/abi7-grid.css">
  <link rel="stylesheet" href="../shared/page.css">
  <link rel="stylesheet" href="./demo.css">
</head>
<body>
  <div class="toolbar">
    <button id="reset">reset()</button>
    <button id="toggle">unuse('counter')</button>
    <button id="top">top(3)</button>
    <span id="total" style="color:var(--muted)">Всего кликов: 0</span>
  </div>

  <div id="gallery" class="demo-grid"></div>
  <div class="log" id="log">Кликайте по карточкам.</div>

  <script type="module" src="../shared/theme.js"></script>
  <script type="module" src="./demo.js"></script>
</body>
</html>
